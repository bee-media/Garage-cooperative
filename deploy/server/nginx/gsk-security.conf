# /etc/nginx/snippets/gsk-security.conf — заголовки безопасности (подключается в каждый location)
add_header X-Content-Type-Options "nosniff" always;
add_header Strict-Transport-Security "max-age=15552000" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), payment=()" always;
# Скрипты и стили только свои; inline-стили нужны React (атрибут style), скриптов inline нет
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; font-src 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
